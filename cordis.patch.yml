# Summary router: pick the model that writes compaction summaries.
#
# The row id doubles as the settings namespace the Client settings page edits,
# so keep it identical to the package name.
#
# Every field is volatile: the settings page writes them and a change must
# take effect on the next summary call rather than restarting the plugin.
- insert:
    - id: dsh-summary-router
      name: 'dsh-summary-router'
      config:
        enabled: true
        purposes:
          - compaction
        requireSession: true
        switchRoutes: []
        switchSessionFirst: true
        pressureRoutes: []
        workspaces: []
        safetyMarginTokens: 8192
        attemptTimeoutMs: 120000
        failureBackoffMs: 60000
