  <path d="M21 11.5h7" stroke="#d8524a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3.4 3"/>
  <path d="M21 24.5h7" stroke="#2a6dbd" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M18.4 15.4 21 18l-2.6 2.6" fill="none" stroke="#2a6dbd" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="26" y="21.6" width="6" height="5.8" rx="1.4" fill="url(#cr-fill)"/>
  <rect x="26" y="8.7" width="6" height="5.8" rx="1.4" fill="none" stroke="#d8524a" stroke-width="1.6"/>
</</svg>
