<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="Summary router">
  <defs>
    <linearGradient id="cr-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8ee0"/>
      <stop offset="1" stop-color="#2668b8"/>
    </linearGradient>
  </defs>
  <!-- One summary request leaves the history. -->
  <circle cx="8" cy="18" r="3.2" fill="#2a6dbd"/>
